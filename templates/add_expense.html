{% extends "base.html" %}

{% block title %}Add an expense — Spendly{% endblock %}

{% block content %}

<section class="add-expense-section">
    <div class="add-expense-container">

        <header class="add-expense-header">
            <h1 class="add-expense-title">Add an expense</h1>
            <p class="add-expense-subtitle">Log a single transaction in under 10 seconds.</p>
        </header>

        <form method="post" action="/expenses/add" class="add-expense-form">
            <input type="hidden" name="next" value="{{ next_url or '/profile' }}">

            {% if error %}
            <p class="add-expense-error">{{ error }}</p>
            {% endif %}

            <label class="add-expense-field">
                <span>Amount (&#8377;)</span>
                <input type="number" name="amount" step="0.01" min="0.01" required
                       value="{{ amount }}">
            </label>

            <label class="add-expense-field">
                <span>Category</span>
                <select name="category" required>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if cat == selected_category %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="add-expense-field">
                <span>Date</span>
                <input type="date" name="date" required value="{{ date }}">
            </label>

            <label class="add-expense-field">
                <span>Description (optional)</span>
                <input type="text" name="description" maxlength="200"
                       value="{{ description }}">
            </label>

            <div class="add-expense-actions">
                <button type="submit" class="add-expense-submit">Add expense</button>
                <a href="{{ next_url or '/profile' }}" class="add-expense-cancel">Cancel</a>
            </div>
        </form>

    </div>
</section>

{% endblock %}
